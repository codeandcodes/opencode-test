id: data-dashboard
title: "Data Dashboard"
category: dataviz
type: review
timeout_minutes: 45
prompt: |
  Build a self-contained static web app: index.html entry point, no build
  step, no external network access (no CDNs, no fonts, no fetch). All code
  in plain HTML/CSS/JS files loaded from index.html.

  Build an interactive dashboard for the messy order data below. Embed the
  CSV verbatim in your app (e.g. in a <script type="text/csv"> block or a
  JS string) and parse it at load time — do not clean it by hand first.

  1. Robust CSV parsing: handle quoted fields containing commas, escaped
     quotes (""), blank/missing values, and inconsistent region casing
     (normalize e.g. "north"/"North"/"NORTH" to one label). Rows with an
     unparseable revenue or date are excluded and counted.
  2. Stat tiles across the top: total revenue, total units, order count,
     excluded-row count.
  3. Three hand-rolled SVG charts (no chart libraries): a line chart of
     weekly revenue over time, a bar chart of revenue by region, and a
     scatter plot of units vs revenue per order.
  4. Hover tooltips on all three charts showing exact values.
  5. Brushing: drag horizontally on the line chart to select a date
     range; the bar chart, scatter plot, and stat tiles re-render using
     only orders inside the range. A clear-brush button resets.
  6. Legend with a color per region; clicking a legend entry toggles that
     region across ALL charts and the tiles.
  7. Axes with sensible ticks and labels; charts resize with the window.

