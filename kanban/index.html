<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban Board</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <header class="header">
            <h1>Kanban Board</h1>
            <div class="header-controls">
                <button id="undoBtn" class="btn btn-secondary" title="Undo (Ctrl+Z)">
                    <span class="icon">↶</span> Undo
                </button>
            </div>
        </header>

        <div class="filter-bar">
            <input type="text" id="searchInput" class="search-input" placeholder="Search cards...">
            <div id="labelFilters" class="label-filters"></div>
        </div>

        <div id="board" class="board"></div>
    </div>

    <div id="cardModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Edit Card</h2>
                <button class="modal-close" id="modalClose">&times;</button>
            </div>
            <form id="cardForm">
                <input type="hidden" id="cardId">
                <input type="hidden" id="cardColumnId">
                <div class="form-group">
                    <label for="cardTitle">Title</label>
                    <input type="text" id="cardTitle" required>
                </div>
                <div class="form-group">
                    <label for="cardDescription">Description</label>
                    <textarea id="cardDescription" rows="4"></textarea>
                </div>
                <div class="form-group">
                    <label for="cardLabels">Labels</label>
                    <div class="label-checkboxes" id="cardLabelCheckboxes"></div>
                </div>
                <div class="form-group">
                    <label for="cardDueDate">Due Date</label>
                    <input type="date" id="cardDueDate">
                </div>
                <div class="form-actions">
                    <button type="button" id="modalDelete" class="btn btn-danger">Delete</button>
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
